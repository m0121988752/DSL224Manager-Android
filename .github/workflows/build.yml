name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

    - name: Prepare Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/
        cp app/build/outputs/apk/debug/app-debug.apk dist/

    - name: Verify APK Signatures
      run: |
        echo "=== Verifying Release APK Signature ==="
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs dist/app-release.apk
        echo "=== Verifying Debug APK Signature ==="
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs dist/app-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSL224Manager-Android-APK
        path: dist/
