name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Setup Signing Keystore from Secrets
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        mkdir -p app/keystore
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/keystore/release.jks
          echo "Keystore successfully decoded from GitHub Secrets."
        else
          echo "Warning: RELEASE_KEYSTORE_BASE64 secret is not configured."
        fi

    - name: Build with Gradle
      env:
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

    - name: Clean Keystore File
      run: rm -f app/keystore/release.jks

    - name: Prepare Artifacts
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/
        cp app/build/outputs/apk/debug/app-debug.apk dist/

    - name: Verify APK Signatures
      run: |
        echo "=== Verifying Release APK Signature ==="
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs dist/app-release.apk
        echo "=== Verifying Debug APK Signature ==="
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs dist/app-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSL224Manager-Android-APK
        path: dist/

    - name: Publish GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.1.${{ github.run_number }}"
        echo "Publishing GitHub Release $TAG_NAME"
        cat << 'EOF' > release_notes.md
        ### ما الجديد في هذا التحديث (What's New):
        * توقيع رقمي دائم وآمن عبر أسرار GitHub المعتمدة (GitHub Secrets) حتى عام 2056
        * عزل وتأمين مفتاح التوقيع الرقمي بالكامل لمنع تسريبه وضمان موثوقية التحديثات
        * دعم التحديث التلقائي الفوري والتثبيت المباشر دون الحاجة لحذف التطبيق بعد هذا الإصدار
        * نافذة ما الجديد (What's New) التفاعلية داخل التطبيق وفحص أحدث الإصدارات
        * واجهة إعدادات عصرية بنمط Material 3 مع شرائح تحديد سعة الباقة السريعة
        * تحسين استخراج السرعات الحية والتعامل مع راوترات D-Link و Huawei
        EOF
        gh release create "$TAG_NAME" dist/app-release.apk dist/app-debug.apk \
          --title "DSL224Manager Android $TAG_NAME" \
          --notes-file release_notes.md
